# Prometheus config for local/dev use — scrapes the API's GET /metrics
# and loads Task 40's alerting rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: neuroflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # no Alertmanager wired up in this dev stack; alerts still evaluate and show in /alerts
