# Production compose file. Build/run with:
#   docker compose -f infra/docker-compose.prod.yml up --build
#
# Reuses the SAME postgres/redis/mlflow/jaeger/prometheus/grafana service
# definitions as infra/docker-compose.yml (dev) via the `extends`-free
# approach of just declaring them again here with production overrides —
# compose doesn't support merging two files' service configs field-by-field
# without an explicit -f infra/docker-compose.yml -f infra/docker-compose.prod.yml
# layering, which is the intended usage: this file is an OVERRIDE layer,
# not a full standalone stack. Run it as:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up --build
# The api/worker/nginx blocks below are complete on their own either way.

services:
  postgres:
    deploy:
      resources:
        limits: { memory: 2g, cpus: '2.0' }
    restart: unless-stopped

  redis:
    deploy:
      resources:
        limits: { memory: 512m, cpus: '0.5' }
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: runtime
    deploy:
      replicas: 2
      resources:
        limits: { memory: 1g, cpus: '1.0' }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # read_only:true means /app/uploads and /app/training_data (writable
    # paths the app needs — see backend/Dockerfile) must be tmpfs or
    # volumes too, not just /tmp, or the app will fail to write uploads.
    volumes:
      - uploads:/app/uploads
      - training_data:/app/training_data
    env_file:
      - ../.env
    # No ports: published here — nginx is the only public entrypoint in
    # prod; api is reached via the nginx upstream (infra/nginx/nginx.conf)
    # over the compose network instead.
    expose:
      - "8000"

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: runtime
    command: python -m worker
    deploy:
      replicas: 2
      resources:
        limits: { memory: 2g, cpus: '2.0' }  # workers need more for ML models (OCR, embeddings, reranking)
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes:
      - uploads:/app/uploads
      - training_data:/app/training_data
    env_file:
      - ../.env

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: runtime
    deploy:
      replicas: 2
      resources:
        limits: { memory: 512m, cpus: '0.5' }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://localhost
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [api, frontend]
    restart: unless-stopped

volumes:
  uploads:
  training_data:
