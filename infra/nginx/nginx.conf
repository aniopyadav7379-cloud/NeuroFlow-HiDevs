# Production nginx: TLS termination, upstream load balancing across the 2
# API replicas, per-IP rate limiting, gzip, and security headers.
#
# Cert: infra/nginx/certs/selfsigned.crt + selfsigned.key are a
# self-signed pair for LOCAL/DEV use only (generated via:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout selfsigned.key -out selfsigned.crt \
#     -subj "/C=US/ST=Dev/L=Dev/O=NeuroFlow/CN=localhost"
# ). Browsers will show a trust warning — expected for self-signed certs.
#
# TO SWAP FOR LET'S ENCRYPT IN PRODUCTION:
#   1. Run certbot against your real domain (standalone or webroot mode),
#      e.g.: certbot certonly --standalone -d api.yourdomain.com
#   2. Mount the resulting /etc/letsencrypt/live/yourdomain/{fullchain,privkey}.pem
#      into this container in place of infra/nginx/certs/*, and update
#      ssl_certificate / ssl_certificate_key below to point at them.
#   3. Add a certbot renewal cron/sidecar (certbot certs expire every 90
#      days) — e.g. the certbot/certbot image on a periodic `renew` command
#      sharing the same volume, plus an nginx reload after renewal.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── rate limiting ───────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    # ── gzip ─────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/xml image/svg+xml;

    # ── upstreams ────────────────────────────────────────────────────
    upstream neuroflow_api {
        # `api` resolves to all replicas behind compose's internal DNS
        # (deploy.replicas: 2 in docker-compose.prod.yml) — nginx load
        # balances across them round-robin by default.
        server api:8000;
    }

    upstream neuroflow_frontend {
        server frontend:3000;
    }

    # ── HTTP -> HTTPS redirect ───────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # security headers (mirrors backend/security/headers_middleware.py
        # for requests nginx serves/proxies before they even reach the API)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'" always;

        client_max_body_size 100m;  # matches backend's MAX_UPLOAD_SIZE_MB default

        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://neuroflow_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE endpoints (GET /query/{id}/stream, /evaluations/stream)
            # must not be buffered — buffering would hold every event
            # until nginx's buffer fills, defeating "streams token by
            # token" entirely.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://neuroflow_frontend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
