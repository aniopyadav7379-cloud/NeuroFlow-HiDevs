name: Security scan

on:
  push:
    branches: [main]

jobs:
  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: make build-api

      - name: Build frontend image
        run: make build-frontend

      - name: Run Trivy vulnerability scanner (API)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'neuroflow-api:latest'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner (frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'neuroflow-frontend:latest'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: detect-secrets scan
        run: |
          pip install --break-system-packages detect-secrets
          detect-secrets scan --baseline .secrets.baseline --exclude-files 'node_modules|\.next|package-lock\.json'
